<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- No page zoom: the map zooms itself. iOS Safari ignores user-scalable, see main.ts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1320" />
    <meta name="description" content="Vent AROME HD sur le Bassin d'Arcachon" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Translucent: the map runs under the clock. iOS (18) installed apps then report a page
         shortened by the bar (innerHeight 793 for an 852 px screen) and draw nothing below it,
         unless the page itself is 100vh tall (app.css): tested on the iPhone, Nov. 2026.
         iOS reads this when the app is added to the home screen: re-add it after a change. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>Kite Bassin</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
