<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- No page zoom: the map zooms itself. iOS Safari ignores user-scalable, see main.ts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1320" />
    <meta name="description" content="Vent AROME HD sur le Bassin d'Arcachon" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque, not black-translucent: with a translucent bar, iOS (18) installed apps start the
         page under the status bar but still shorten it by the bar's height, so the bottom
         59 px were never drawn (measured: innerHeight 793 for an 852 px screen).
         iOS reads this when the app is added to the home screen: re-add it after a change. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>Kite Bassin</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
