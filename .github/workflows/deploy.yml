# Fetch the latest AROME 0.01° run and AROME-PI gusts, build the app and publish it on GitHub Pages.
# Runs on every push and every 15 min, at odd minutes: GitHub delays or drops scheduled runs when
# busy, worst on the hour (a single hourly slot once gave 3 runs in 18 h). AROME runs every 3 h:
# an unchanged run is copied from the published site instead of downloaded again. AROME-PI runs
# every hour. On the schedule, nothing is published when neither run changed.
# GitHub's schedule alone gave only 3 to 4 runs a day (Nov. 2026): an external cron (cron-job.org)
# calls workflow_dispatch with scheduled=true every 15 min, which behaves like the schedule.
name: Données AROME + déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Comme le planning : ne rien publier si AROME et AROME-PI n'ont pas changé"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.data.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Données AROME + AROME-PI
        id: data
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: |
          # Runs currently online, to reuse AROME and to tell whether anything changed.
          runs() { python -c "import json,sys; m=json.load(sys.stdin); print(m.get('run'), (m.get('pi') or {}).get('run'))"; }
          published=$(curl -sf "$PAGES_URL/data/meta.json" | runs || echo "none")
          python pipeline/fetch_arome.py --out public/data --reuse-from "$PAGES_URL/data"
          python pipeline/fetch_aromepi.py --out public/data
          python pipeline/fetch_tide.py --out public/data
          fresh=$(runs < public/data/meta.json)
          echo "online: $published / new: $fresh"
          scheduled=${{ github.event_name == 'schedule' || inputs.scheduled == true }}
          if [ "$scheduled" = "true" ] && [ "$published" = "$fresh" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.data.outputs.skipped == 'false'
        with:
          node-version: 24
          cache: npm

      - name: Build
        if: steps.data.outputs.skipped == 'false'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outputs.skipped == 'false'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
