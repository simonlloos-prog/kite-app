# Two jobs, so that new data never means rebuilding the app:
# - data: fetch the latest AROME 0.01° run, AROME-PI gusts, tide and a fallback copy of the
#   station readings, and upload them to Cloudflare R2 (bucket kite-data), which the Worker
#   (worker/) serves to the app at /data/. No build, no deployment.
# - app: build the app and publish it on GitHub Pages, only when the code changes (push) or on
#   a manual run.
# AROME runs every 3 h and AROME-PI every hour: an unchanged AROME run is left in R2 (only
# meta.json is rewritten). On the schedule, nothing is uploaded when neither run changed. Live
# station readings come from the Worker; meta.json only keeps a fallback copy.
# Triggers: an external cron (cron-job.org) calls workflow_dispatch with scheduled=true every
# 15 min, since GitHub's own schedule (kept as a backup, at odd minutes) gave only 3 to 4 runs a
# day (Nov. 2026).
name: Données AROME + déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Comme le planning : ne rien déposer si AROME et AROME-PI n'ont pas changé, ne pas redéployer l'appli"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Public addresses, not secrets: the Worker serving R2, and the R2 S3 endpoint of the account.
  DATA_URL: https://kite-obs.kite-app.workers.dev/data
  R2_ENDPOINT: https://c26d5962672f2b3456ca1d5d574e4147.r2.cloudflarestorage.com
  R2_BUCKET: kite-data

jobs:
  data:
    runs-on: ubuntu-latest
    # One upload at a time: meta.json must never point at files of a run still being written.
    concurrency:
      group: data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Données AROME + AROME-PI + marée + stations
        id: data
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          API_MAREE_KEY: ${{ secrets.API_MAREE_KEY }}
        run: |
          # Runs currently online, to reuse AROME and to tell whether anything changed.
          runs() { python -c "import json,sys; m=json.load(sys.stdin); print(m.get('run'), (m.get('pi') or {}).get('run'))"; }
          curl -sf "$DATA_URL/meta.json" -o published.json || echo '{}' > published.json
          published=$(runs < published.json || echo "none")
          python pipeline/fetch_arome.py --out public/data --reuse-from "$DATA_URL" --meta-only
          python pipeline/fetch_aromepi.py --out public/data
          # AROME-PI failed (API down): keep the one already published, its file is still in R2,
          # rather than drop the gust trend until the API is back.
          python - <<'EOF'
          import json
          meta, pub = (json.load(open(p)) for p in ("public/data/meta.json", "published.json"))
          if "pi" not in meta and pub.get("pi") and pub.get("grid") == meta.get("grid"):
              meta["pi"] = pub["pi"]
              json.dump(meta, open("public/data/meta.json", "w"), indent=1)
              print(f"AROME-PI unavailable: kept the published run {pub['pi']['run']}")
          EOF
          python pipeline/fetch_tide.py --out public/data
          python pipeline/fetch_obs.py --out public/data
          fresh=$(runs < public/data/meta.json)
          echo "online: $published / new: $fresh"
          scheduled=${{ github.event_name == 'schedule' || inputs.scheduled == true }}
          if [ "$scheduled" = "true" ] && [ "$published" = "$fresh" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dépôt dans R2
        if: steps.data.outputs.skipped == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects some checksums recent AWS CLI versions send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          s3() { aws s3 --endpoint-url "$R2_ENDPOINT" --only-show-errors "$@"; }
          # Hour and AROME-PI files, gzipped (~5x smaller): their names carry the run, so they
          # never change. Only new ones are here: a reused AROME run stays in R2 as it is.
          mkdir -p upload
          (cd public/data && find . -name '*.bin') | while read -r f; do
            mkdir -p "upload/$(dirname "$f")"
            gzip -9 -c "public/data/$f" > "upload/$f"
          done
          echo "$(find upload -name '*.bin' | wc -l) fichiers à déposer"
          s3 cp upload "s3://$R2_BUCKET/data" --recursive \
            --content-encoding gzip --content-type application/octet-stream \
            --cache-control "public, max-age=31536000, immutable"
          # meta.json last: it points at the files above, which must be there first.
          s3 cp public/data/meta.json "s3://$R2_BUCKET/data/meta.json" \
            --content-type "application/json; charset=utf-8" --cache-control no-cache

  app:
    # Code changes and manual runs only: data runs never rebuild the app. After the data job,
    # so that a new app never reads an R2 that does not have what it expects yet.
    needs: data
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.scheduled != true)) }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
