<!doctype html>
<!-- Test page for the iPhone status bar, installed as a second home-screen app ("Kite test"):
     same app, but with the translucent status bar, and page-height variants to try from the
     diagnostics (long press on ⟳) without reinstalling. See src/lib/iosTest.ts. -->
<html lang="fr" data-ios-test>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1320" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kite test" />
    <link rel="manifest" href="ios-test.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>Kite test</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
